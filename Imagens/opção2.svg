<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="0.55" stop-color="#FDE9EE"/>
      <stop offset="1" stop-color="#E3F1FB"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="casquinha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9964F"/>
      <stop offset="0.45" stop-color="#F2C48C"/>
      <stop offset="1" stop-color="#C7803F"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </radialGradient>
    <clipPath id="cortaCasquinha"><polygon points="1385,330 1575,330 1480,585"/></clipPath>
    <clipPath id="cortaCasquinha2"><polygon points="-60,0 60,0 0,170"/></clipPath>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#8A3B55" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1920" height="600" fill="url(#fundo)"/>

  <!-- brilhos suaves de fundo -->
  <circle cx="1480" cy="260" r="330" fill="url(#brilho)"/>
  <g fill="#FFFFFF">
    <circle cx="260" cy="120" r="46" opacity="0.35"/>
    <circle cx="620" cy="470" r="70" opacity="0.28"/>
    <circle cx="980" cy="110" r="34" opacity="0.4"/>
    <circle cx="1160" cy="420" r="52" opacity="0.3"/>
    <circle cx="140" cy="440" r="28" opacity="0.4"/>
    <circle cx="820" cy="260" r="22" opacity="0.35"/>
  </g>

  <!-- onda decorativa na base -->
  <path d="M0 520 Q240 470 480 520 T960 520 T1440 520 T1920 520 V600 H0 Z" fill="#FFFFFF" opacity="0.55"/>
  <path d="M0 560 Q240 520 480 560 T960 560 T1440 560 T1920 560 V600 H0 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- SORVETE PRINCIPAL -->
  <g filter="url(#sombra)">
    <!-- casquinha -->
    <polygon points="1385,330 1575,330 1480,585" fill="url(#casquinha)"/>
    <g clip-path="url(#cortaCasquinha)" stroke="#B8732F" stroke-width="3" opacity="0.55">
      <line x1="1360" y1="330" x2="1520" y2="600"/>
      <line x1="1405" y1="330" x2="1565" y2="600"/>
      <line x1="1450" y1="330" x2="1610" y2="600"/>
      <line x1="1495" y1="330" x2="1655" y2="600"/>
      <line x1="1600" y1="330" x2="1440" y2="600"/>
      <line x1="1555" y1="330" x2="1395" y2="600"/>
      <line x1="1510" y1="330" x2="1350" y2="600"/>
      <line x1="1465" y1="330" x2="1305" y2="600"/>
    </g>
    <rect x="1372" y="318" width="216" height="24" rx="12" fill="#E3A862"/>

    <!-- bola de baixo: morango -->
    <g fill="#F7A3BC">
      <circle cx="1480" cy="300" r="108"/>
      <rect x="1376" y="300" width="208" height="62"/>
      <circle cx="1392" cy="362" r="26"/>
      <circle cx="1444" cy="370" r="26"/>
      <circle cx="1498" cy="364" r="26"/>
      <circle cx="1550" cy="368" r="26"/>
    </g>
    <circle cx="1480" cy="300" r="108" fill="url(#luz)"/>

    <!-- bola de cima: menta -->
    <g fill="#A9E2C9">
      <circle cx="1480" cy="180" r="90"/>
      <rect x="1392" y="180" width="176" height="52"/>
      <circle cx="1406" cy="232" r="22"/>
      <circle cx="1450" cy="240" r="22"/>
      <circle cx="1498" cy="234" r="22"/>
      <circle cx="1546" cy="238" r="22"/>
    </g>
    <circle cx="1480" cy="180" r="90" fill="url(#luz)"/>

    <!-- confeitos -->
    <g>
      <rect x="1430" y="140" width="18" height="6" rx="3" fill="#E75480" transform="rotate(30 1430 140)"/>
      <rect x="1500" y="120" width="18" height="6" rx="3" fill="#FFF4D6" transform="rotate(-35 1500 120)"/>
      <rect x="1470" y="190" width="18" height="6" rx="3" fill="#E8A96B" transform="rotate(55 1470 190)"/>
      <rect x="1530" y="170" width="18" height="6" rx="3" fill="#D9C7F5" transform="rotate(-10 1530 170)"/>
      <rect x="1420" y="215" width="18" height="6" rx="3" fill="#E75480" transform="rotate(-50 1420 215)"/>
    </g>

    <!-- cereja -->
    <path d="M1482 98 Q1496 70 1520 60" stroke="#6B3B2A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="1480" cy="112" r="20" fill="#C93A5E"/>
    <ellipse cx="1473" cy="105" rx="6" ry="4" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- SORVETE SECUNDÁRIO -->
  <g transform="translate(1790 400) rotate(9)" filter="url(#sombra)">
    <polygon points="-60,0 60,0 0,170" fill="url(#casquinha)"/>
    <g clip-path="url(#cortaCasquinha2)" stroke="#B8732F" stroke-width="3" opacity="0.55">
      <line x1="-80" y1="0" x2="20" y2="190"/>
      <line x1="-40" y1="0" x2="60" y2="190"/>
      <line x1="0" y1="0" x2="100" y2="190"/>
      <line x1="80" y1="0" x2="-20" y2="190"/>
      <line x1="40" y1="0" x2="-60" y2="190"/>
      <line x1="0" y1="0" x2="-100" y2="190"/>
    </g>
    <rect x="-68" y="-10" width="136" height="18" rx="9" fill="#E3A862"/>
    <g fill="#FFEFC2">
      <circle cx="0" cy="-48" r="68"/>
      <rect x="-68" y="-48" width="136" height="40"/>
      <circle cx="-52" cy="-8" r="17"/>
      <circle cx="-17" cy="-3" r="17"/>
      <circle cx="19" cy="-7" r="17"/>
      <circle cx="52" cy="-4" r="17"/>
    </g>
    <circle cx="0" cy="-48" r="68" fill="url(#luz)"/>
    <rect x="-24" y="-80" width="14" height="5" rx="2.5" fill="#E75480" transform="rotate(25 -24 -80)"/>
    <rect x="12" y="-92" width="14" height="5" rx="2.5" fill="#BDEBD7" transform="rotate(-30 12 -92)"/>
    <rect x="22" y="-60" width="14" height="5" rx="2.5" fill="#D9C7F5" transform="rotate(50 22 -60)"/>
  </g>
</svg>
